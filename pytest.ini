[pytest]
# Marker definitions
markers =
    requires_cuda: test requires NVIDIA CUDA GPU

# Default: skip CUDA tests unless explicitly requested
addopts = -m "not requires_cuda" -k "not cuda"

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# faulthandler is enabled by default in pytest for segfault tracebacks
